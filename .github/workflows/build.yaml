name: build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so base image security updates ship without a version bump.
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_TIMESCALEDB: ghcr.io/${{ github.repository }}
  IMAGE_TOOLKIT: ghcr.io/${{ github.repository }}/toolkit

jobs:
  lint:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: Dockerfile

      - name: Lint toolkit.Dockerfile
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: toolkit.Dockerfile

      - name: Lint shell scripts
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: hack

  prepare:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      pg_major: ${{ steps.args.outputs.pg_major }}
      tsdb_version: ${{ steps.args.outputs.tsdb_version }}
      toolkit_version: ${{ steps.args.outputs.toolkit_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read build arguments
        id: args
        run: |
          set -euo pipefail
          # TOOLKIT_VERSIONS is oldest-first; the last entry is what the image is.
          toolkit_versions="$(sed -n 's/^ARG TOOLKIT_VERSIONS=//p' toolkit.Dockerfile | tr -d '"')"
          {
            echo "pg_major=$(sed -n 's/^ARG PG_MAJOR=//p' Dockerfile)"
            echo "tsdb_version=$(sed -n 's/^ARG TSDB_VERSION=//p' Dockerfile)"
            echo "toolkit_version=${toolkit_versions##* }"
          } >> "$GITHUB_OUTPUT"

  # Native runner per architecture rather than QEMU: an emulated apt install plus
  # initdb dominates the workflow.
  build:
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Exported as plain directories so the extensions can be mounted the same
      # way CloudNativePG mounts an ImageVolume. The pushes reuse this cache.
      - name: Build TimescaleDB extension tree
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=local,dest=extension
          cache-from: type=gha,scope=timescaledb-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=timescaledb-${{ matrix.arch }}

      - name: Build toolkit extension tree
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: toolkit.Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=local,dest=toolkit
          cache-from: type=gha,scope=toolkit-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=toolkit-${{ matrix.arch }}

      - name: Verify both extensions load in a stock CloudNativePG image
        run: hack/verify.sh extension toolkit

      - name: Log in to ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Untagged. The merge job tags the manifest list it assembles from these
      # digests, and attaches provenance to that index instead.
      - name: Push TimescaleDB by digest
        id: push_timescaledb
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_TIMESCALEDB }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=timescaledb-${{ matrix.arch }}
          provenance: false
          sbom: false

      - name: Push toolkit by digest
        id: push_toolkit
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: toolkit.Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_TOOLKIT }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=toolkit-${{ matrix.arch }}
          provenance: false
          sbom: false

      - name: Record digests
        if: github.event_name != 'pull_request'
        env:
          ARCH: ${{ matrix.arch }}
          TIMESCALEDB_DIGEST: ${{ steps.push_timescaledb.outputs.digest }}
          TOOLKIT_DIGEST: ${{ steps.push_toolkit.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p digests/timescaledb digests/toolkit
          echo "${TIMESCALEDB_DIGEST}" > "digests/timescaledb/${ARCH}"
          echo "${TOOLKIT_DIGEST}"     > "digests/toolkit/${ARCH}"

      - name: Upload digests
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: digests/*/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prepare, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: timescaledb
            image: ghcr.io/${{ github.repository }}
          - name: toolkit
            image: ghcr.io/${{ github.repository }}/toolkit
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version for this image
        id: version
        run: |
          set -euo pipefail
          case "${{ matrix.name }}" in
            timescaledb) echo "value=${{ needs.prepare.outputs.tsdb_version }}" >> "$GITHUB_OUTPUT" ;;
            toolkit)     echo "value=${{ needs.prepare.outputs.toolkit_version }}" >> "$GITHUB_OUTPUT" ;;
            *) echo "unknown image ${{ matrix.name }}" >&2; exit 1 ;;
          esac

      # Immutable tags only. A rolling tag would let a cluster's extension change
      # underneath it, which restarts PostgreSQL.
      - name: Create and push the manifest list
        id: manifest
        env:
          IMAGE: ${{ matrix.image }}
          NAME: ${{ matrix.name }}
          TAG: ${{ steps.version.outputs.value }}-pg${{ needs.prepare.outputs.pg_major }}
        run: |
          set -euo pipefail
          refs=()
          for f in "digests/${NAME}"/*; do
            refs+=("${IMAGE}@$(cat "${f}")")
          done
          if [ ${#refs[@]} -eq 0 ]; then
            echo "no digests found for ${{ matrix.name }}" >&2
            exit 1
          fi
          echo "assembling ${IMAGE}:${TAG} from ${#refs[@]} manifests"
          docker buildx imagetools create --tag "${IMAGE}:${TAG}" "${refs[@]}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" \
            --format '{{ .Manifest.Digest }}')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "${IMAGE}:${TAG}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - name: Summary
        env:
          IMAGE: ${{ matrix.image }}
          TAG: ${{ steps.version.outputs.value }}-pg${{ needs.prepare.outputs.pg_major }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          {
            echo "### ${{ matrix.name }} ${TAG}"
            echo
            echo '```'
            echo "${IMAGE}:${TAG}"
            echo "${IMAGE}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
